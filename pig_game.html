<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피그 게임 (Pig Game)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">
    <div class="bg-slate-800/90 border border-slate-700 p-6 sm:p-8 rounded-3xl shadow-2xl max-w-lg w-full text-center">
        <h1 class="text-2xl font-black text-pink-400 mb-1 flex items-center justify-center gap-2">
            <i class="fa-solid fa-piggy-bank"></i> Pig Game (피그 게임)
        </h1>
        <p class="text-xs text-slate-400 mb-6">숫자 **1**이 나오면 턴 점수 리셋! 50점을 먼저 채우세요.</p>

        <!-- Player Scores -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div id="p0-card" class="bg-slate-900/80 p-4 rounded-2xl border-2 border-pink-500 transition-all">
                <div class="text-xs font-bold text-slate-400">Player 1</div>
                <div id="score-0" class="text-4xl font-black my-2 text-pink-400">0</div>
                <div class="bg-slate-800 py-1 px-2 rounded-lg text-xs">턴 점수: <span id="current-0" class="font-bold text-amber-300">0</span></div>
            </div>
            <div id="p1-card" class="bg-slate-900/40 p-4 rounded-2xl border-2 border-transparent transition-all">
                <div class="text-xs font-bold text-slate-400">Player 2</div>
                <div id="score-1" class="text-4xl font-black my-2 text-pink-400">0</div>
                <div class="bg-slate-800 py-1 px-2 rounded-lg text-xs">턴 점수: <span id="current-1" class="font-bold text-amber-300">0</span></div>
            </div>
        </div>

        <div id="dice-view" class="text-6xl mb-4">🎲</div>
        <div id="status-msg" class="text-xs font-semibold text-slate-300 mb-6 h-4">Player 1의 차례입니다.</div>

        <div class="grid grid-cols-2 gap-3 mb-3">
            <button onclick="rollDice()" class="bg-pink-600 hover:bg-pink-500 py-3 rounded-2xl font-bold shadow-lg shadow-pink-900/40">🎲 주사위 던지기</button>
            <button onclick="holdScore()" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-2xl font-bold shadow-lg shadow-emerald-900/40">📥 점수 저장 (Hold)</button>
        </div>

        <button onclick="initGame()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl text-xs font-semibold">
            게임 리셋
        </button>
    </div>

    <script>
        let scores, currentScore, activePlayer, playing;
        const diceIcons = ['🎲', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function initGame() {
            scores = [0, 0]; currentScore = 0; activePlayer = 0; playing = true;
            document.getElementById('score-0').innerText = '0';
            document.getElementById('score-1').innerText = '0';
            document.getElementById('current-0').innerText = '0';
            document.getElementById('current-1').innerText = '0';
            document.getElementById('dice-view').innerText = '🎲';
            document.getElementById('status-msg').innerText = 'Player 1의 차례입니다.';
            updateUI();
        }

        function updateUI() {
            document.getElementById('p0-card').className = activePlayer === 0 ? 'bg-slate-900/80 p-4 rounded-2xl border-2 border-pink-500 transition-all' : 'bg-slate-900/40 p-4 rounded-2xl border-2 border-transparent transition-all';
            document.getElementById('p1-card').className = activePlayer === 1 ? 'bg-slate-900/80 p-4 rounded-2xl border-2 border-pink-500 transition-all' : 'bg-slate-900/40 p-4 rounded-2xl border-2 border-transparent transition-all';
        }

        function switchPlayer() {
            document.getElementById('current-' + activePlayer).innerText = '0';
            currentScore = 0;
            activePlayer = activePlayer === 0 ? 1 : 0;
            updateUI();
            document.getElementById('status-msg').innerText = `Player ${activePlayer + 1}의 차례입니다.`;
        }

        function rollDice() {
            if(!playing) return;
            const dice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-view').innerText = diceIcons[dice];

            if(dice !== 1) {
                currentScore += dice;
                document.getElementById('current-' + activePlayer).innerText = currentScore;
            } else {
                document.getElementById('status-msg').innerText = '💥 1이 나왔습니다! 턴 점수를 모두 잃습니다.';
                setTimeout(switchPlayer, 1000);
            }
        }

        function holdScore() {
            if(!playing || currentScore === 0) return;
            scores[activePlayer] += currentScore;
            document.getElementById('score-' + activePlayer).innerText = scores[activePlayer];

            if(scores[activePlayer] >= 50) {
                playing = false;
                document.getElementById('status-msg').innerText = `🎉 Player ${activePlayer + 1} 최종 승리!`;
            } else {
                switchPlayer();
            }
        }

        initGame();
    </script>
</body>
</html>
