```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 주사위 게임</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .game {
        width: 90%;
        max-width: 600px;
        padding: 40px 25px;
        text-align: center;
        background: white;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h1 {
        margin: 0 0 10px;
        font-size: 38px;
    }

    .info {
        color: #666;
        margin-bottom: 30px;
    }

    .dice-area {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
    }

    .dice {
        width: 110px;
        height: 110px;
        background: white;
        border: 4px solid #333;
        border-radius: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 75px;
        box-shadow: 0 7px 15px rgba(0,0,0,0.15);
    }

    .rolling {
        animation: shake 0.12s infinite;
    }

    @keyframes shake {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(10deg); }
        50% { transform: rotate(-10deg); }
        75% { transform: rotate(7deg); }
        100% { transform: rotate(0deg); }
    }

    .total {
        font-size: 30px;
        font-weight: bold;
        margin: 25px 0;
    }

    .total span {
        color: #667eea;
        font-size: 40px;
    }

    button {
        border: none;
        border-radius: 15px;
        padding: 17px 40px;
        font-size: 21px;
        font-weight: bold;
        color: white;
        background: #667eea;
        cursor: pointer;
    }

    button:hover {
        background: #5568d9;
        transform: scale(1.05);
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
        transform: none;
    }

    .message {
        margin: 25px 0;
        min-height: 30px;
        font-size: 20px;
        font-weight: bold;
    }

    .score {
        display: flex;
        justify-content: space-around;
        background: #f1f3ff;
        border-radius: 15px;
        padding: 15px;
        font-size: 17px;
    }

    @media (max-width: 500px) {
        .dice {
            width: 85px;
            height: 85px;
            font-size: 58px;
        }

        .dice-area {
            gap: 8px;
        }

        h1 {
            font-size: 30px;
        }
    }
</style>
</head>

<body>

<div class="game">

    <h1>🎲 주사위 게임 🎲</h1>

    <div class="info">
        주사위 3개를 굴려 가장 높은 점수를 만들어 보세요!
    </div>

    <div class="dice-area">
        <div class="dice" id="dice1">⚀</div>
        <div class="dice" id="dice2">⚀</div>
        <div class="dice" id="dice3">⚀</div>
    </div>

    <div class="total">
        합계 <span id="total">3</span>
    </div>

    <button id="rollButton" onclick="rollDice()">
        🎲 주사위 굴리기
    </button>

    <div class="message" id="message">
        버튼을 눌러 주사위를 굴려보세요!
    </div>

    <div class="score">
        <div>
            🏆 최고 점수<br>
            <strong id="bestScore">0</strong>
        </div>

        <div>
            🎮 게임 횟수<br>
            <strong id="gameCount">0</strong>
        </div>
    </div>

</div>

<script>

const symbols = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

let bestScore = 0;
let gameCount = 0;

function randomDice() {
    return Math.floor(Math.random() * 6) + 1;
}

function rollDice() {

    const button = document.getElementById("rollButton");
    const dice1 = document.getElementById("dice1");
    const dice2 = document.getElementById("dice2");
    const dice3 = document.getElementById("dice3");

    const dice = [dice1, dice2, dice3];

    button.disabled = true;

    dice.forEach(d => {
        d.classList.add("rolling");
    });

    document.getElementById("message").textContent =
        "🎲 주사위를 굴리는 중...";

    let count = 0;

    const animation = setInterval(function() {

        dice.forEach(d => {
            const n = randomDice();
            d.textContent = symbols[n - 1];
        });

        count++;

        if (count >= 15) {

            clearInterval(animation);

            dice.forEach(d => {
                d.classList.remove("rolling");
            });

            const n1 = randomDice();
            const n2 = randomDice();
            const n3 = randomDice();

            dice1.textContent = symbols[n1 - 1];
            dice2.textContent = symbols[n2 - 1];
            dice3.textContent = symbols[n3 - 1];

            const total = n1 + n2 + n3;

            document.getElementById("total").textContent = total;

            gameCount++;
            document.getElementById("gameCount").textContent = gameCount;

            let message = "";

            if (total === 18) {
                message = "🎉🎉 축하합니다! 최고 점수 18점!";
            }
            else if (total > bestScore) {
                bestScore = total;

                document.getElementById("bestScore").textContent =
                    bestScore;

                message = "🏆 신기록 달성!";
            }
            else if (total >= 14) {
                message = "🔥 아주 높은 점수입니다!";
            }
            else if (total >= 9) {
                message = "👍 좋은 점수입니다!";
            }
            else {
                message = "😅 아쉽네요! 다시 도전해보세요!";
            }

            document.getElementById("message").textContent = message;

            button.disabled = false;
        }

    }, 100);
}

</script>

</body>
</html>
